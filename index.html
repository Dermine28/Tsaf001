<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Embedding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Monoton&family=Pinyon+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1> this is my title</title></h1>
        </header>
        <main>
            <section>
                <!-- ai prompt for placeholder content:in the main, add a section with an h3 and two paragraphs about snow-->
                <h3>something about snow </h3>
                <p>Snow is made of tiny ice crystals that fall gently from clouds during cold weather.</p>
                <p>Fresh snow can transform landscapes into bright, quiet scenes perfect for winter activities.</p>
            </section>

            <section>
                <!-- embedding external resources like videos and maps-->
                 <iframe width="560" height="315" src="https://www.youtube.com/embed/qk6MeIXsUeU?si=WfW5E-lkk0F4brRM" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </section>

            <section>
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2803.9488705579643!2d-75.75881522355706!3d45.349844371072514!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4cce0718cc4a6ad7%3A0xc6cc467725843e2b!2sColl%C3%A8ge%20algonquin!5e0!3m2!1sfr!2sca!4v1795509776048!5m2!1sfr!2sca" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </section>
        </main>
    </div>
    
</body>
</html>
